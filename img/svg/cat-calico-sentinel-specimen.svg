<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%" fill="none" role="img" aria-label="翡翠三花挺拔端坐標本板">
<g id="calico-cat-specimen-root">
  <!-- Swiss Precision Construction Grid (Background Layer) -->
  <rect x="0" y="0" width="280" height="200" fill="var(--riso-paper, #FAF8F5)" rx="6"/>
  <rect x="12" y="12" width="256" height="176" fill="none" stroke="var(--riso-grid-line, rgba(45,41,38,0.12))" stroke-width="0.8" stroke-dasharray="3 3"/>
  <rect x="20" y="20" width="240" height="160" fill="none" stroke="var(--riso-grid-line, rgba(45,41,38,0.08))" stroke-width="0.6"/>

  <!-- Technical Registration Crosshairs & Datum Lines -->
  <!-- Top Left Registration Mark -->
  <g transform="translate(24, 24)" stroke="var(--riso-sage, #3E6B56)" stroke-width="0.8">
    <circle cx="0" cy="0" r="4.5" fill="none"/>
    <line x1="-7" y1="0" x2="7" y2="0"/>
    <line x1="0" y1="-7" x2="0" y2="7"/>
    <text x="9" y="3.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6.5" fill="var(--text-dim, #888077)" letter-spacing="0.08em" stroke="none">REG.MK 02-B // CH-02</text>
  </g>

  <!-- Top Right Micro Coordinates -->
  <g transform="translate(256, 26)" text-anchor="end">
    <text x="0" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7" font-weight="700" fill="var(--riso-sage, #3E6B56)" letter-spacing="0.1em">SPECIMEN 02 // E-02</text>
    <text x="0" y="9" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6" fill="var(--text-dim, #888077)" letter-spacing="0.06em">AXIS 90.0° · ISOSCELES · SOLID BOUNDARIES</text>
  </g>

  <!-- Bottom Left Baseline Annotation -->
  <g transform="translate(24, 182)">
    <text x="0" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6" fill="var(--riso-rose, #C06C52)" font-weight="600" letter-spacing="0.06em">ASSERTIVE POSTURE · ZERO REFLEXIVE APOLOGY</text>
  </g>

  <!-- Bottom Right Scale & Grid Spec -->
  <g transform="translate(256, 182)" text-anchor="end">
    <text x="0" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6" fill="var(--text-dim, #888077)" letter-spacing="0.05em">280×200MM // 24×24 SWISS DOT</text>
  </g>

  <!-- Vertical Central Datum Axis (AXIS 90.0°) -->
  <line x1="140" y1="16" x2="140" y2="184" stroke="var(--riso-sage, #3E6B56)" stroke-width="0.8" stroke-dasharray="3 3"/>
  <circle cx="140" cy="16" r="1.5" fill="var(--riso-sage, #3E6B56)"/>
  <circle cx="140" cy="184" r="1.5" fill="var(--riso-sage, #3E6B56)"/>

  <!-- Master Isosceles Triangle Construction Line (堅定邊界構造骨架) -->
  <polygon points="140,32 88,168 192,168" fill="none" stroke="var(--riso-rose, #C06C52)" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.45"/>
  <text x="143" y="38" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6" fill="var(--riso-rose, #C06C52)">APEX 72°</text>

  <!-- Concentric Boundary Radial Waves (警醒雷達場) -->
  <circle cx="140" cy="68" r="30" fill="none" stroke="var(--riso-sage, #3E6B56)" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="140" cy="68" r="48" fill="none" stroke="var(--riso-sage, #3E6B56)" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="140" cy="68" r="66" fill="none" stroke="var(--riso-sage, #3E6B56)" stroke-width="0.4" stroke-dasharray="5 5" opacity="0.2"/>

  <!-- Horizontal Ground Plane -->
  <line x1="36" y1="168" x2="244" y2="168" stroke="var(--text-dim, #888077)" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- RISOGRAPH LAYER 1 (Terracotta Misregistration Shift Layer - dx=-1.5, dy=1.2) -->
  <g transform="translate(-1.5, 1.2)" opacity="0.28" style="mix-blend-mode: multiply;">
    <!-- Upright Body Silhouette Shift -->
    <path d="M 124 74 L 112 110 L 98 168 H 182 L 168 110 L 156 74 Z" fill="var(--riso-rose, #C06C52)"/>
    <!-- Head Shift -->
    <circle cx="140" cy="68" r="19" fill="var(--riso-rose, #C06C52)"/>
    <!-- Pointed Ears Shift -->
    <polygon points="120,62 114,36 132,48" fill="var(--riso-rose, #C06C52)"/>
    <polygon points="148,48 166,36 160,62" fill="var(--riso-rose, #C06C52)"/>
  </g>

  <!-- RISOGRAPH LAYER 2 (Primary Tri-Color Calico Vector Architecture) -->
  <g>
    <!-- Base Body Silhouette (Clean White Architectural Monolith) -->
    <path d="M 126 76 C 122 96, 110 125, 100 168 H 180 C 170 125, 158 96, 154 76 Z" fill="#FFFFFF" stroke="var(--text-main, #2D2926)" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Calico Distinct Patch 1: Terracotta Flank & Shoulder (Warm Riso Ink) -->
    <path d="M 100 168 L 108 132 C 114 136, 122 144, 126 168 Z" fill="var(--riso-rose, #C06C52)" opacity="0.88"/>
    <!-- Calico Distinct Patch 2: Sage Green Chest & Shoulder (Cool Riso Ink) -->
    <path d="M 154 76 C 158 96, 168 120, 180 168 L 166 168 C 158 140, 146 112, 142 94 Z" fill="var(--riso-sage, #3E6B56)" opacity="0.88"/>

    <!-- Two Parallel Pillar Front Legs (挺拔如柱：雙前腿筆直並攏，基底穩如泰山) -->
    <rect x="127" y="108" width="10" height="60" rx="4" fill="#FFFFFF" stroke="var(--text-main, #2D2926)" stroke-width="1.2"/>
    <rect x="143" y="108" width="10" height="60" rx="4" fill="#FFFFFF" stroke="var(--text-main, #2D2926)" stroke-width="1.2"/>
    <line x1="132" y1="160" x2="132" y2="167" stroke="var(--text-main, #2D2926)" stroke-width="0.8"/>
    <line x1="148" y1="160" x2="148" y2="167" stroke="var(--text-main, #2D2926)" stroke-width="0.8"/>

    <!-- Neatly Wrapped Tail Around Paws (收束防禦邊界，泰然自若) -->
    <path d="M 180 166 C 196 166, 198 152, 186 144 C 174 138, 170 148, 160 156 C 148 165, 120 167, 102 167" fill="none" stroke="var(--text-main, #2D2926)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 186 144 C 192 148, 194 158, 182 165" fill="none" stroke="var(--riso-amber, #9E6234)" stroke-width="4" stroke-linecap="round"/>

    <!-- Head Contour (Circle + Alert Cheeks) -->
    <circle cx="140" cy="68" r="19" fill="#FFFFFF" stroke="var(--text-main, #2D2926)" stroke-width="1.4"/>
    <!-- Head Calico Patch: Right Temple (Sage Green) -->
    <path d="M 140 50 C 148 50, 158 56, 158 68 C 158 74, 152 78, 144 76 Z" fill="var(--riso-sage, #3E6B56)" opacity="0.88"/>
    <!-- Head Calico Patch: Left Brow (Terracotta Rose) -->
    <path d="M 122 64 C 122 54, 130 50, 140 50 L 138 62 C 132 64, 126 66, 122 64 Z" fill="var(--riso-rose, #C06C52)" opacity="0.88"/>

    <!-- Upright Pointed Triangular Ears (雙耳高聳直立，警醒審視邊界) -->
    <!-- Left Ear (With Terracotta inner) -->
    <polygon points="121,62 115,36 133,48" fill="#FFFFFF" stroke="var(--text-main, #2D2926)" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="122,58 118,41 130,49" fill="var(--riso-rose, #C06C52)" opacity="0.75"/>
    <!-- Right Ear (With Sage inner) -->
    <polygon points="147,48 165,36 159,62" fill="#FFFFFF" stroke="var(--text-main, #2D2926)" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="150,49 162,41 158,58" fill="var(--riso-sage, #3E6B56)" opacity="0.75"/>

    <!-- Alert Eyes (平視堅定眼神，不畏縮不退讓) -->
    <!-- Left Almond Eye -->
    <path d="M 126 68 Q 131 63 136 68 Q 131 73 126 68 Z" fill="#FFFFFF" stroke="var(--text-main, #2D2926)" stroke-width="1.2"/>
    <circle cx="131" cy="68" r="2.2" fill="var(--text-main, #2D2926)"/>
    <circle cx="132" cy="67" r="0.7" fill="#FFFFFF"/>
    <!-- Right Almond Eye -->
    <path d="M 144 68 Q 149 63 154 68 Q 149 73 144 68 Z" fill="#FFFFFF" stroke="var(--text-main, #2D2926)" stroke-width="1.2"/>
    <circle cx="149" cy="68" r="2.2" fill="var(--text-main, #2D2926)"/>
    <circle cx="150" cy="67" r="0.7" fill="#FFFFFF"/>

    <!-- Geometric Muzzle & Whiskers -->
    <polygon points="140,73 138,71 142,71" fill="var(--riso-rose, #C06C52)"/>
    <!-- Left Whiskers (Straight, Firm) -->
    <line x1="135" y1="73" x2="116" y2="70" stroke="var(--text-main, #2D2926)" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="135" y1="75" x2="118" y2="76" stroke="var(--text-main, #2D2926)" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Right Whiskers -->
    <line x1="145" y1="73" x2="164" y2="70" stroke="var(--text-main, #2D2926)" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="145" y1="75" x2="162" y2="76" stroke="var(--text-main, #2D2926)" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Technical Stamp Badge -->
  <g transform="translate(86, 126)">
    <rect x="0" y="0" width="30" height="12" fill="var(--riso-paper, #FAF8F5)" stroke="var(--riso-sage, #3E6B56)" stroke-width="0.7"/>
    <text x="3" y="8.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="5.5" font-weight="700" fill="var(--riso-sage, #3E6B56)" letter-spacing="0.06em">BOUNDS</text>
  </g>
</g>
</svg>